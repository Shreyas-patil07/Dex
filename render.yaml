services:
  - type: web
    name: dex-api
    runtime: python
    branch: main
    rootDir: backend
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: Dex API
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://dex-list.vercel.app
      - key: CORS_ORIGINS
        value: https://dex-list.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: dex-07
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
