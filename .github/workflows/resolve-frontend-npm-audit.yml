name: Resolve frontend npm audit findings

on:
  push:
    branches: [fix/frontend-npm-audit]
    paths:
      - frontend/package.json
      - .github/workflows/resolve-frontend-npm-audit.yml

permissions:
  contents: write

jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile without changing package majors
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact locked dependency tree
        run: npm ci
      - name: Verify no high or critical npm advisories remain
        run: npm audit --audit-level=high
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify production build
        run: npm run build
      - name: Commit verified lockfile and remove one-off workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git rm .github/workflows/resolve-frontend-npm-audit.yml
          git commit -m "fix: resolve frontend npm audit advisories"
          git push origin HEAD:refs/heads/fix/frontend-npm-audit
